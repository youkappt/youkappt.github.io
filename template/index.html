<style>
/* ===== Design Tokens (Cream Paper / Forest Ink / Highlighter) ===== */
:root {
  --color-cream-paper:#fcfaf5;
  --color-forest-ink:#1a3300;
  --color-forest-ink-deep:#223f08;
  --color-highlighter-yellow:#ffe95c;
  --color-pencil-gray:#b6b6b6;
  --color-whisper-gray:#f1f1f1;
  --color-fog-veil:#6b6b6b;
  --color-moon-mist:#565c47;
  --color-terracotta:#cb5521;
  --color-sticky-note-mint:#d5f5c2;
  --color-sticky-note-teal:#a8e5e5;
  --color-glass-edge:rgba(26,51,0,.12);

  --font-ui:'Inter','Noto Sans SC','PingFang SC',sans-serif;
  --font-display:'Bricolage Grotesque','Noto Sans SC','PingFang SC',sans-serif;
  --font-mono:'Roboto Mono',ui-monospace,monospace;

  --radius-cards:12px;
  --radius-badges:9999px;
  --radius-modals:16px;
  --radius-buttons:9999px;

  --shadow-card:rgba(26,51,0,.06) 0 1px 2px 0, rgba(26,51,0,.05) 0 8px 24px 0;
  --shadow-modal:rgba(26,51,0,.10) 0 16px 48px 0;
}

/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font-ui);
  background: var(--color-cream-paper);
  color: var(--color-forest-ink);
  min-height: 100vh;
  position: relative;
  overflow-x: hidden;
}

/* ===== Ambient Background Layers (subtle forest tint) ===== */
.bg-grid {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(26, 51, 0, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(26, 51, 0, 0.04) 1px, transparent 1px);
  background-size: 80px 80px;
  -webkit-mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 30%, transparent 80%);
  mask-image: radial-gradient(ellipse 100% 80% at 50% 0%, #000 30%, transparent 80%);
}

.bg-halo {
  position: fixed;
  top: -5%;
  left: 50%;
  transform: translateX(-50%);
  width: 140vw;
  height: 60vh;
  z-index: 0;
  pointer-events: none;
  background: conic-gradient(at 50% 50%,
    transparent 45%,
    rgba(213, 245, 194, 0.45) 49%,
    rgba(213, 245, 194, 0.65) 50%,
    rgba(213, 245, 194, 0.45) 51%,
    transparent 55%);
  -webkit-mask-image: radial-gradient(ellipse 60% 100% at 50% 50%, #000 0%, transparent 70%);
  mask-image: radial-gradient(ellipse 60% 100% at 50% 50%, #000 0%, transparent 70%);
  opacity: 0.5;
}

/* ===== Top Bar ===== */
.top-bar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(252, 250, 245, 0.92);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--color-pencil-gray);
  padding: 14px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.top-bar .title-wrap {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

/* 左侧品牌区：logo + 文案紧贴 */
.top-bar .brand {
  display: flex;
  align-items: center;
  gap: 14px;
  text-decoration: none;
  color: var(--color-forest-ink);
}

.top-bar .eyebrow {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--color-fog-veil);
  opacity: 0.7;
}

.top-bar .title {
  font-family: var(--font-display);
  font-size: 18px;
  font-weight: 600;
  color: var(--color-forest-ink);
  letter-spacing: -0.3px;
}

.top-bar .logo-img {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid var(--color-glass-edge);
  box-shadow: 0 4px 12px rgba(26, 51, 0, 0.12);
  transition: transform 0.3s ease, box-shadow 0.3s ease;
  flex-shrink: 0;
}

.top-bar .logo-img:hover {
  transform: scale(1.08) rotate(3deg);
  box-shadow: 0 6px 16px rgba(26, 51, 0, 0.18);
}

.buy-btn {
  background: var(--color-forest-ink);
  color: var(--color-cream-paper);
  border: none;
  padding: 9px 22px;
  border-radius: var(--radius-buttons);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  text-decoration: none;
  display: inline-block;
  font-family: var(--font-ui);
}

.buy-btn:hover {
  background: var(--color-forest-ink-deep);
  transform: translateY(-1px);
  box-shadow: 0 4px 16px rgba(26, 51, 0, 0.25);
}

/* ===== Masonry Gallery ===== */
.gallery {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: flex-start;
  gap: 16px;
  padding: 32px 24px 110px;   /* 底部多留白，容纳各列错位 */
  max-width: 1320px;
  margin: 0 auto;
}

/* 视口底部渐变蒙版：固定停在浏览器窗口底部，图片经过时自然淡出 */
body::after {
  content: '';
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: 220px;
  pointer-events: none;
  z-index: 50;
  background: linear-gradient(
    to top,
    var(--color-cream-paper) 0%,
    rgba(252, 250, 245, 0.85) 30%,
    rgba(252, 250, 245, 0.45) 60%,
    transparent 100%
  );
}

/* 底部固定购买引导条 */
.cta-bar {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 60;
  background: var(--color-forest-ink);
  border: 1px solid var(--color-forest-ink);
  border-radius: 16px;
  padding: 12px 28px;
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  box-shadow:
    0 8px 32px rgba(26, 51, 0, 0.25),
    inset 0 1px 1px rgba(255, 255, 255, 0.06);
  text-align: center;
  max-width: 680px;
  width: calc(100% - 48px);
}

.cta-bar .cta-text {
  font-family: var(--font-ui);
  font-size: 14px;
  line-height: 1.6;
  color: var(--color-cream-paper);
  letter-spacing: 0.02em;
}

.cta-price {
  color: var(--color-highlighter-yellow);
  font-weight: 700;
  font-size: 17px;
}

.cta-wechat {
  color: var(--color-sticky-note-teal);
  font-weight: 600;
}

/* CTA 条悬停弹出二维码 */
.cta-bar .qr-popup {
  position: absolute;
  bottom: calc(100% + 12px);
  left: 50%;
  transform: translateX(-50%) translateY(8px);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  z-index: 70;
  background: rgba(255, 255, 255, 0.98);
  border: 1px solid var(--color-pencil-gray);
  border-radius: 16px;
  padding: 16px;
  box-shadow: 0 16px 48px rgba(26, 51, 0, 0.2);
}
.cta-bar .qr-popup img {
  display: block;
  width: 200px;
  height: auto;
  border-radius: 10px;
}
.cta-bar .qr-popup::after {
  content: '';
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  border: 8px solid transparent;
  border-top-color: var(--color-pencil-gray);
}
.cta-bar:hover .qr-popup {
  opacity: 1;
  visibility: visible;
  transform: translateX(-50%) translateY(0);
}

/* 视口顶部渐变蒙版：固定在导航栏下方，图片从上方自然淡入 */
body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  height: 320px;
  pointer-events: none;
  z-index: 5;
  background: linear-gradient(
    to bottom,
    var(--color-cream-paper) 0%,
    rgba(252, 250, 245, 0.92) 20%,
    rgba(252, 250, 245, 0.65) 45%,
    rgba(252, 250, 245, 0.25) 70%,
    transparent 100%
  );
}

/* JS 瀑布流：列容器（每列独立一束卡片） */
.masonry-col {
  flex: 1 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 16px;
  will-change: transform;
}

.card {
  border-radius: var(--radius-cards);
  overflow: hidden;
  background: #fff;
  border: 1px solid var(--color-pencil-gray);
  box-shadow: var(--shadow-card);
  cursor: pointer;
  transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
  position: relative;
}

.card:hover {
  transform: translateY(-5px);
  border-color: var(--color-forest-ink);
  box-shadow:
    rgba(26, 51, 0, 0.08) 0 1px 2px 0,
    rgba(26, 51, 0, 0.12) 0 16px 40px 0;
}

.card img {
  width: 100%;
  display: block;
  transition: transform 0.4s ease;
}

.card:hover img {
  transform: scale(1.04);
}

/* Lazy load — 滚动到可视区域才加载，兼容 file:// 与 http:// */
.card img { opacity: 0; transition: opacity 0.5s ease; }
.card img.loaded { opacity: 1; }

/* ===== Modal ===== */
.modal-overlay {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(26, 51, 0, 0.45);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.25s ease, visibility 0.25s ease;
}

.modal-overlay.active { opacity: 1; visibility: visible; }

.modal {
  background: #fff;
  border: 1px solid var(--color-pencil-gray);
  border-radius: var(--radius-modals);
  max-width: 760px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  position: relative;
  box-shadow: var(--shadow-modal);
  transform: scale(0.92) translateY(20px);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}

.modal-overlay.active .modal { transform: scale(1) translateY(0); }

.modal-close {
  position: absolute;
  top: 14px;
  right: 14px;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--color-whisper-gray);
  color: var(--color-forest-ink);
  border: 1px solid var(--color-pencil-gray);
  font-size: 18px;
  cursor: pointer;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.modal-close:hover {
  background: var(--color-highlighter-yellow);
  color: var(--color-forest-ink);
}

.modal-image-wrap img {
  width: 100%;
  display: block;
  border-radius: var(--radius-modals) var(--radius-modals) 0 0;
}

.modal-info { padding: 24px 28px 28px; }

.modal-info h2 {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 600;
  margin-bottom: 6px;
  color: var(--color-forest-ink);
}

.modal-info .price {
  font-family: var(--font-display);
  font-size: 24px;
  font-weight: 600;
  color: var(--color-terracotta);
  margin-bottom: 20px;
}

.buy-btn-modal {
  width: 100%;
  background: var(--color-forest-ink);
  color: var(--color-cream-paper);
  border: none;
  padding: 14px;
  border-radius: var(--radius-buttons);
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-ui);
}

.buy-btn-modal:hover {
  background: var(--color-forest-ink-deep);
  transform: translateY(-2px);
  box-shadow: 0 6px 24px rgba(26, 51, 0, 0.3);
}

.modal-nav {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-top: 18px;
}

.modal-nav button {
  background: var(--color-whisper-gray);
  color: var(--color-forest-ink);
  border: 1px solid var(--color-pencil-gray);
  padding: 10px 22px;
  border-radius: var(--radius-buttons);
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s ease;
  font-family: var(--font-ui);
}

.modal-nav button:hover:not(:disabled) {
  background: var(--color-highlighter-yellow);
  border-color: var(--color-forest-ink);
  color: var(--color-forest-ink);
}

.modal-nav button:disabled { opacity: 0.3; cursor: not-allowed; }

.modal-nav #pageIndicator {
  font-family: var(--font-mono);
  font-size: 13px;
  color: var(--color-fog-veil);
  min-width: 56px;
  text-align: center;
}

/* ===== Placeholder ===== */
.placeholder {
  position: relative;
  z-index: 1;
  column-span: all;
  text-align: center;
  padding: 100px 20px;
  color: var(--color-fog-veil);
}

.placeholder h3 {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  color: var(--color-forest-ink);
  margin-bottom: 12px;
}

.placeholder p { font-size: 14px; line-height: 1.8; }
.placeholder code {
  font-family: var(--font-mono);
  background: rgba(26, 51, 0, 0.06);
  padding: 2px 6px;
  border-radius: var(--radius-badges);
  color: var(--color-forest-ink);
}

/* ===== Responsive ===== */
@media (max-width: 1024px) {
  .gallery { gap: 14px; }
  .masonry-col { gap: 14px; }
}
@media (max-width: 768px) {
  .gallery { gap: 12px; padding: 20px 16px 96px; }
  .masonry-col { gap: 12px; }
  .card { border-radius: 12px; }
  .top-bar { padding: 12px 16px; }
  .top-bar .title { font-size: 15px; }
  .modal { max-height: 92vh; }
  .modal-info { padding: 18px 20px 22px; }
}
@media (max-width: 480px) {
  .gallery { padding: 16px 12px 88px; gap: 10px; }
  .masonry-col { gap: 10px; }
  .card { border-radius: 10px; }
}

    var tmp = CONFIG.images[s]; CONFIG.images[s] = CONFIG.images[r]; CONFIG.images[r] = tmp;
  }

  var gallery = document.getElementById('gallery');

  if (CONFIG.images.length === 0) {
    gallery.innerHTML =
      '<div class="placeholder">' +
      '<h3>📷 还没有添加预览图</h3>' +
      '<p>请将图片放入 <code>images/</code> 文件夹，<br>并在代码 CONFIG.images 中配置文件名。</p>' +
      '</div>';
    return;
  }

  buildMasonry();
  updateNavButtons();
}

/* ===== 瀑布流：最短列优先 + 列错位（错落有致） ===== */
var currentCols = 0;

function getColCount() {
  var w = window.innerWidth;
  if (w <= 480) return 2;
  if (w <= 768) return 2;
  if (w <= 1024) return 3;
  return 4;
}

// 每列顶部错位的视觉偏移（纯装饰，不参与高度计算），形成对角线错落
function getOffsets(cols) {
  if (cols >= 4) return [0, 54, 26, 80];
  if (cols === 3) return [0, 42, 21];
  return [0, 30];
}

// 每张卡片的稳定伪随机估计高度（260~580px），用于最短列均衡分配
function estHeight(i) {
  var x = Math.sin(i * 12.9898) * 43758.5453;
  var f = x - Math.floor(x);
  return 260 + f * 320;
}

function makeCard(src, i) {
  var card = document.createElement('div');
  card.className = 'card';
  card.onclick = function() { openModal(i); };
  // 关键：图片未加载前给卡片占位高度，否则所有卡片塌缩在首屏、
  // IntersectionObserver 会一次性触发全部图片加载（懒加载失效）
  card.style.minHeight = Math.round(estHeight(i)) + 'px';
  var img = new Image();
  img.alt = CONFIG.templateName + ' 第' + (i + 1) + '页';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.dataset.src = 'images/' + src;   // 先挂 data-src，滚动到才真正加载
  card.appendChild(img);
  return card;
}

function buildMasonry() {
  var gallery = document.getElementById('gallery');
  var cols = getColCount();
  currentCols = cols;
  var offsets = getOffsets(cols);

  gallery.innerHTML = '';
  var colEls = [];
  var colHeights = [];
  for (var c = 0; c < cols; c++) {
    var col = document.createElement('div');
    col.className = 'masonry-col';
    col.style.transform = 'translateY(' + offsets[c] + 'px)';
    gallery.appendChild(col);
    colEls.push(col);
    colHeights.push(0);
  }

  CONFIG.images.forEach(function(src, i) {
    var card = makeCard(src, i);
    // 放入当前「估计高度」最小的列 → 各列高度均衡且错落
    var minC = 0;
    for (var c = 1; c < cols; c++) {
      if (colHeights[c] < colHeights[minC]) minC = c;
    }
    colEls[minC].appendChild(card);
    colHeights[minC] += estHeight(i) + 16;   // + 列内间距
  });

  setupLazy();
}

// 懒加载：滚动到可视区域才加载真实图片（兼容 file:// 与 http://）
function setupLazy() {
  if ('IntersectionObserver' in window) {
    var observer = new IntersectionObserver(function(entries) {
      entries.forEach(function(entry) {
        if (entry.isIntersecting) {
          var img = entry.target;
          if (img.dataset.src) {
            img.src = img.dataset.src;
            img.removeAttribute('data-src');
            img.onload = function() {
              img.classList.add('loaded');
              // 真图到位后撤掉占位高度，让卡片按真实图高排版
              if (img.parentNode) img.parentNode.style.minHeight = '';
            };
            observer.unobserve(img);
          }
        }
      });
    }, { rootMargin: '120px' });
    document.querySelectorAll('.card img[data-src]').forEach(function(img) { observer.observe(img); });
  } else {
    document.querySelectorAll('.card img[data-src]').forEach(function(img) {
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
      img.classList.add('loaded');
    });
  }
}

function openModal(index) {
  currentIndex = index;
  document.getElementById('modalImg').src = 'images/' + CONFIG.images[currentIndex];
  document.getElementById('modalOverlay').classList.add('active');
  document.body.style.overflow = 'hidden';
  updateNavButtons();
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
  document.body.style.overflow = '';
}

function closeModalOnOverlay(e) {
  if (e.target === e.currentTarget) closeModal();
}

function navigateModal(dir) {
  currentIndex += dir;
  if (currentIndex < 0) currentIndex = CONFIG.images.length - 1;
  if (currentIndex >= CONFIG.images.length) currentIndex = 0;
  document.getElementById('modalImg').src = 'images/' + CONFIG.images[currentIndex];
  updateNavButtons();
}

function updateNavButtons() {
  var total = CONFIG.images.length;
  document.getElementById('pageIndicator').textContent = (currentIndex + 1) + ' / ' + total;
  document.getElementById('prevBtn').disabled = total <= 1;
  document.getElementById('nextBtn').disabled = total <= 1;
}

function handlePurchase() {
  if (CONFIG.buyLink) {
    window.open(CONFIG.buyLink, '_blank');
  } else {
    alert('购买功能待配置\n\n请联系作者获取此模板：\n可在此处填写微信号 / 淘宝链接等');
  }
}

function openQuickBuy() { handlePurchase(); }

document.addEventListener('keydown', function(e) {
  var overlay = document.getElementById('modalOverlay');
  if (!overlay.classList.contains('active')) return;
  if (e.key === 'Escape') closeModal();
  if (e.key === 'ArrowLeft') navigateModal(-1);
  if (e.key === 'ArrowRight') navigateModal(1);
});

init();

// 窗口尺寸变化时，若列数改变则重建瀑布流（错位随之重新计算）
var resizeTimer = null;
window.addEventListener('resize', function() {
  if (resizeTimer) clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function() {
    if (getColCount() !== currentCols) buildMasonry();
  }, 200);
});
</script>
